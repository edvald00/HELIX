<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Visualizador · Painel Hélix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css" />
</head>
<body class="admin-body">

<div class="admin-layout">
  <div class="admin-backdrop" id="adminBackdrop"></div>
  <div id="adminSidebarMount"></div>

  <div class="admin-main">
    <header class="admin-topbar">
      <button class="admin-nav-toggle" id="adminNavToggle" aria-label="Abrir menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <nav class="admin-breadcrumb" aria-label="Breadcrumb">Painel / <b>Visualizador</b></nav>
    </header>

    <div class="admin-content">
      <div class="admin-page-head">
        <div class="admin-eyebrow">Ambiente local</div>
        <h1>Visualizador 3D</h1>
        <p>Use o painel Next.js local ou a versão publicada na Vercel para a experiência completa.</p>
      </div>

      <div class="admin-canvas-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
        </svg>
        <h3 style="font-family:var(--font-display);font-size:1.1rem">Renderizador 3D</h3>
        <p style="color:var(--text-muted);font-size:0.9rem">Abra o app Next.js em <code style="color:var(--accent)">npm run dev</code> ou use o painel na Vercel.</p>
        <div style="display:flex;gap:0.75rem;flex-wrap:wrap;justify-content:center;margin-top:0.5rem">
          <a href="/" class="admin-btn admin-btn--secondary" target="_blank" rel="noopener">App local (porta 3000)</a>
          <a href="#" id="openPanelLink" class="admin-btn admin-btn--primary" target="_blank" rel="noopener noreferrer">Painel Vercel</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="auth.js"></script>
<script src="admin.js"></script>
<script>
  initAdminPage('dashboard').then(session => {
    if (!session) return;
    const link = document.getElementById('openPanelLink');
    if (link) link.href = HelixAuth.getPanelUrl(session);
  });
</script>
</body>
</html>
